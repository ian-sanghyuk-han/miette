<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8C5216; text-decoration: none; } a:hover { color: #C4832E; }
    .ser { font-family: 'Cormorant Garamond', Georgia, serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .lbl { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 9.5px;
           letter-spacing: 2.2px; color: #6F6250; text-transform: uppercase; }
  </style>
</helmet>

<div style="font-family: 'IBM Plex Sans KR', system-ui, sans-serif; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F0DF; color: #2A2118; padding: 24px 20px 0;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6250" stroke-width="1.6" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="lbl">가성비</div>
    <div class="mono" style="font-size: 10.5px; color: #6F6250;">바게트</div>
  </div>

  <div style="margin-top: 16px;">
    <div class="ser" style="font-size: 24px; font-weight: 600;">왼쪽 위가 보물입니다</div>
    <div style="font-size: 11.5px; color: #544737; margin-top: 5px; line-height: 1.5;">
      세로는 내가 매긴 순위, 가로는 내가 낸 값. 점선은 이 리그의 한가운데입니다.</div>
  </div>

  <div style="border: 1px solid #E2D6B9; background: #FCF8EE; margin-top: 16px; padding: 12px 10px 8px;">
    <svg width="348" height="352" viewBox="0 0 348 352">

      <rect x="18" y="12" width="134" height="148" fill="#C4832E" opacity="0.055"/>

      <line x1="152" y1="12" x2="152" y2="322" stroke="#CFC0A0" stroke-width="1" stroke-dasharray="3 4"/>
      <line x1="18" y1="160" x2="322" y2="160" stroke="#CFC0A0" stroke-width="1" stroke-dasharray="3 4"/>

      <text x="24" y="26" font-family="'IBM Plex Sans KR', sans-serif" font-size="9.5" fill="#8C5216" font-weight="600">보물 — 싸고 좋다</text>
      <text x="316" y="26" text-anchor="end" font-family="'IBM Plex Sans KR', sans-serif" font-size="9.5" fill="#6F6250">값을 한다</text>
      <text x="24" y="316" font-family="'IBM Plex Sans KR', sans-serif" font-size="9.5" fill="#6F6250">그저 그렇다</text>
      <text x="316" y="316" text-anchor="end" font-family="'IBM Plex Sans KR', sans-serif" font-size="9.5" fill="#6F6250">다시 안 간다</text>

      <g stroke="#2A2118" stroke-width="0.9" opacity="0.6">
        <line x1="18" y1="12" x2="18" y2="322"/>
        <line x1="18" y1="322" x2="322" y2="322"/>
      </g>

      <g class="mono" fill="#6F6250" font-size="8.5">
        <text x="13" y="24" text-anchor="end">1위</text>
        <text x="13" y="164" text-anchor="end">5위</text>
        <text x="13" y="304" text-anchor="end">9위</text>
        <text x="30" y="336" text-anchor="middle">€1.10</text>
        <text x="152" y="336" text-anchor="middle">€1.34</text>
        <text x="310" y="336" text-anchor="middle">€1.60</text>
      </g>

      <g fill="#6F6250" opacity="0.75">
        <circle cx="183" cy="55" r="4"/>
        <circle cx="132" cy="90" r="4"/>
        <circle cx="132" cy="125" r="4"/>
        <circle cx="234" cy="160" r="4"/>
        <circle cx="183" cy="195" r="4"/>
        <circle cx="106" cy="230" r="4"/>
        <circle cx="208" cy="265" r="4"/>
        <circle cx="157" cy="300" r="4"/>
      </g>

      <circle cx="81" cy="20" r="7" fill="#C4832E"/>
      <circle cx="81" cy="20" r="11.5" fill="none" stroke="#8C5216" stroke-width="1" opacity="0.45"/>
      <line x1="92" y1="26" x2="120" y2="48" stroke="#8C5216" stroke-width="0.9"/>
      <text x="124" y="46" font-family="'Cormorant Garamond', serif" font-size="13" font-weight="600" fill="#2A2118">Le Moulin de la Croix Nivert</text>
      <text x="124" y="59" class="mono" font-size="9" fill="#8C5216">1위 · €1.20 — 제일 싸고 제일 낫다</text>

      <line x1="200" y1="262" x2="168" y2="240" stroke="#6F6250" stroke-width="0.9"/>
      <text x="164" y="237" text-anchor="end" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="600" fill="#544737">Bergeron</text>
      <text x="164" y="249" text-anchor="end" class="mono" font-size="8.5" fill="#6F6250">8위 · €1.45</text>
    </svg>
  </div>

  <div class="lbl" style="margin-top: 18px;">이 리그의 숫자</div>
  <div style="display: flex; gap: 7px; margin-top: 9px;">
    <div style="flex: 1 1 0; border: 1px solid #E2D6B9; background: #FCF8EE; padding: 10px 11px;">
      <div class="mono" style="font-size: 17px; font-weight: 500; color: #8C5216;">€1.34</div>
      <div style="font-size: 10px; color: #6F6250; margin-top: 2px;">내가 낸 평균</div>
    </div>
    <div style="flex: 1 1 0; border: 1px solid #E2D6B9; background: #FCF8EE; padding: 10px 11px;">
      <div class="mono" style="font-size: 17px; font-weight: 500;">€0.30</div>
      <div style="font-size: 10px; color: #6F6250; margin-top: 2px;">최저와 최고의 차</div>
    </div>
    <div style="flex: 1 1 0; border: 1px solid #E2D6B9; background: #FCF8EE; padding: 10px 11px;">
      <div class="mono" style="font-size: 17px; font-weight: 500;">31</div>
      <div style="font-size: 10px; color: #6F6250; margin-top: 2px;">기록한 빵</div>
    </div>
  </div>

  <div class="ser" style="font-style: italic; font-size: 14px; color: #544737; margin-top: 16px; line-height: 1.5;">
    1위가 제일 싼 집이기도 합니다.</div>
</div>
</x-dc>
</body>
</html>
