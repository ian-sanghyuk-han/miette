<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Miette</title>
<meta name="description" content="파리 빵집 지도 — 빵자취를 따라서">
<meta name="theme-color" content="#F7F0DF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Miette">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-startup-image" href="icons/splash/splash-440x956@3x.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-430x932@3x.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-402x874@3x.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-393x852@3x.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-428x926@3x.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-414x896@3x.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-414x896@2x.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-390x844@3x.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-375x812@3x.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-375x667@2x.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F7F0DF; --paperDeep:#EFE4C9; --card:#FCF8EE;
  --ink:#2A2118; --ink2:#544737; --mute:#6F6250; --line:#E2D6B9;
  --divider:#F0E7D2; --faint:#CFC0A0;
  --crust:#C4832E; --crustDeep:#8C5216; --olive:#77794F; --seine:#9DAEAC;
  --safeB:env(safe-area-inset-bottom,0px);
  --safeT:env(safe-area-inset-top,0px);
  --tabH:calc(64px + var(--safeB));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
.ser{font-family:'Cormorant Garamond',Georgia,serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.lbl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:2.2px;
  color:var(--mute);text-transform:uppercase}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------------------------------------------------------------- the map */
#stage{position:relative;flex:1 1 auto;overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#veil{position:absolute;top:0;left:0;right:0;height:calc(150px + var(--safeT));pointer-events:none;
  background:linear-gradient(180deg,var(--paper) 0%,rgba(247,240,223,.94) 46%,rgba(247,240,223,0) 100%)}

#head{position:absolute;top:calc(12px + var(--safeT));left:14px;right:14px}
.headrow{display:flex;align-items:center;gap:9px}
#wordmark{font-size:17px;font-weight:600;letter-spacing:3.6px;flex:0 0 auto}
#searchField{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;height:36px;
  padding:0 12px;border:1px solid var(--line);border-radius:18px;
  background:rgba(252,248,238,.92);box-shadow:0 1px 5px rgba(42,33,24,.06);
  color:var(--mute);font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#langbtn{flex:0 0 auto;font-size:10px;letter-spacing:1.2px;color:var(--crustDeep);
  border:1px solid var(--line);border-radius:16px;padding:0 10px;height:36px;
  background:rgba(252,248,238,.92)}
#bar{display:flex;align-items:center;gap:8px;margin-top:8px}
#bar2,#bar3{display:flex;align-items:center;gap:6px;margin-top:5px}
#chips,#chips2,#chips3{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;
  padding-bottom:2px;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar,#chips2::-webkit-scrollbar,#chips3::-webkit-scrollbar{display:none}
#barSep{width:1px;height:22px;background:var(--line);flex:0 0 auto}
/* square = tick as many as you like; the pills above are pick-one */
.tog{display:flex;align-items:center;gap:5px;height:27px;padding:0 10px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:4px;background:rgba(252,248,238,.86);
  color:var(--ink2);font-size:11px;white-space:nowrap}
.tog.on{border-color:var(--crustDeep);background:var(--crustDeep);color:var(--card);font-weight:500}
.tog svg{opacity:.55}
.tog.on svg{opacity:1}
#filterBtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:16px;background:rgba(252,248,238,.9);
  color:var(--ink2);font-size:11.5px}
#filterBtn.on{border-color:var(--crustDeep);color:var(--crustDeep);background:rgba(196,131,46,.12)}
.tool.on{border-color:#D9962F;background:rgba(232,163,58,.18)}
#search{position:fixed;inset:0;z-index:30;background:var(--paper);display:none;
  flex-direction:column;padding-top:var(--safeT)}
#search.on{display:flex}
#searchTop{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#searchIn{flex:1 1 auto;border:none;background:none;outline:none;font:inherit;font-size:16px;
  color:var(--ink);padding:8px 0}
#searchIn::placeholder{color:var(--faint)}
#searchOut{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(24px + var(--safeB))}
.sres{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--divider);width:100%;text-align:left}
.sres b{font-weight:600}
#filterBtn b{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  min-width:15px;height:15px;border-radius:8px;background:var(--crustDeep);color:var(--card);
  display:flex;align-items:center;justify-content:center;padding:0 4px}
.frow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--divider)}
.frow:last-child{border-bottom:none}
.fbox{width:22px;height:22px;border:1.5px solid var(--line);flex:0 0 auto;margin-top:1px;
  display:flex;align-items:center;justify-content:center}
.fbox.rnd{border-radius:12px}
.fbox.on{background:var(--crustDeep);border-color:var(--crustDeep)}
.fname{font-size:13px;font-weight:500}
.fdesc{font-size:11px;color:var(--mute);line-height:1.5;margin-top:3px}
.fcount{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);flex:0 0 auto;margin-top:2px}
.fsub{margin-left:33px;border-left:1px solid var(--line);padding-left:14px}
.fhead{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:2.2px;
  color:var(--mute);text-transform:uppercase;margin-top:20px}
.chip{padding:5px 11px;border-radius:14px;border:1px solid var(--line);
  background:rgba(252,248,238,.86);color:var(--ink2);font-size:11.5px;white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--crustDeep);color:var(--card);border-color:var(--crustDeep);font-weight:500}
/* one level down: same row, lighter weight, the trade's own colour */
.chip.sub{height:27px;padding:0 9px;font-size:11px;border-style:dashed;
  display:flex;align-items:center;gap:5px}
.chip.sub.on{background:rgba(196,131,46,.10);border-style:solid;color:var(--ink);font-weight:500}
.chipsep{width:1px;height:16px;background:var(--line);flex:0 0 auto;align-self:center;margin:0 2px}
.grouplbl{font-family:'IBM Plex Sans KR',sans-serif;font-size:11.5px;color:var(--mute);
  flex:0 0 auto;align-self:center;padding-right:1px}

#tools{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.tool{width:44px;height:44px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(42,33,24,.08)}

#strip{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 16px;height:38px;
  background:var(--card);border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
#strip b{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink)}
.sep{width:1px;height:12px;background:var(--line)}

/* --------------------------------------------------------------- tab bar */
#tabs{flex:0 0 auto;display:flex;height:var(--tabH);padding-bottom:var(--safeB);
  background:var(--card);border-top:1px solid var(--line)}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--mute);min-height:48px}
.tab.on{color:var(--crustDeep)}
.tab.on span{font-weight:600}
.tab span{font-size:10px;letter-spacing:.6px}

/* --------------------------------------------------------------- sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 30px rgba(42,33,24,.16);
  max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px 20px calc(24px + var(--safeB));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.7,.3,1);
  visibility:hidden}
.sheet.open{transform:translateY(0);visibility:visible}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#scrim{position:fixed;inset:0;z-index:15;background:rgba(42,33,24,.28);opacity:0;
  transition:opacity .26s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}

.name{font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;font-weight:600;line-height:1.1}
.meta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.meta div{font-size:11.5px;color:var(--ink2)}
.dot{width:3px;height:3px;border-radius:2px;background:var(--line)}
.rule{height:1px;background:var(--line);margin:15px 0 13px}
.hair{height:1px;background:var(--divider)}

.aw{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider)}
.aw:last-child{border-bottom:none}
.awy{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mute);width:24px;
  text-align:center;flex:0 0 auto}
.awn{flex:1 1 auto;font-size:12.5px;min-width:0}
.awr{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink2);flex:0 0 auto}
.first{font-size:12px;font-weight:600;color:var(--crustDeep)}

.acts{display:flex;gap:7px;margin-top:11px}
.act{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;
  border:1px solid var(--line);background:var(--paper);font-size:12px;color:var(--ink2);
  text-decoration:none}
.note{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mute);
  margin-top:7px;text-align:center;line-height:1.5}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;
  background:var(--crustDeep);color:var(--card);font-size:14px;font-weight:600;letter-spacing:.5px;
  width:100%}
.cta.ghost{background:none;border:1px solid var(--line);color:var(--ink2);font-weight:400}

.seg{display:flex;border:1px solid var(--line);background:var(--card);margin-top:9px}
.seg button{flex:1 1 0;height:46px;font-size:12.5px;color:var(--ink2);border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--crustDeep);color:var(--card);font-weight:600}

.step{display:flex;gap:10px;align-items:flex-start;margin-top:9px}
.stepn{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--crustDeep);width:13px;flex:0 0 auto;padding-top:2px}
.small{font-size:11px;color:var(--mute);line-height:1.55;margin-top:7px}
.body{font-size:12px;color:var(--ink2);line-height:1.55}

#toast{position:fixed;left:50%;bottom:calc(var(--tabH) + 18px);transform:translate(-50%,14px);
  z-index:40;background:var(--ink);color:var(--paper);font-size:12.5px;padding:11px 18px;
  opacity:0;transition:.22s;pointer-events:none;max-width:82%;text-align:center;line-height:1.45}
#toast.on{opacity:1;transform:translate(-50%,0)}

#boot{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;
  opacity:1;transition:opacity .7s ease}
#boot.fading{opacity:0}
#boot.gone{display:none}
#boot .ser{font-size:34px;font-weight:600;letter-spacing:9px}
#boot .inparis{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
  font-size:16px;color:var(--crustDeep);letter-spacing:1px;margin-top:2px}
#boot p{font-size:11.5px;color:var(--mute);margin:14px 0 0}
#bootArt{margin-bottom:22px}
.riseA{animation:rise .9s ease both}
.riseB{animation:rise .9s .12s ease both}
.riseC{animation:rise .9s .24s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="veil"></div>
    <div id="head">
      <div class="headrow">
        <div class="ser" id="wordmark">MIETTE</div>
        <button id="searchField">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6F6250" stroke-width="1.7"
               stroke-linecap="round" style="flex:0 0 auto"><circle cx="10.5" cy="10.5" r="6.8"/><path d="M15.5 15.5L21 21"/></svg>
          <span id="searchFieldLbl"></span>
        </button>
        <button id="langbtn" class="mono">KO</button>
      </div>
      <div id="bar">
        <div id="chips"></div>
      </div>
      <div id="bar2">
        <div id="chips2"></div>
      </div>
      <div id="bar3">
        <div id="chips3"></div>
        <button id="filterBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span id="filterLbl">조건</span>
        </button>
      </div>
    </div>
    <div id="tools">
      <button class="tool" id="zoomAll" aria-label="whole city">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#544737" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg>
      </button>
      <button class="tool" id="legendBtn" aria-label="legend">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#544737" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16.5v-5"/><path d="M12 8h.01"/></svg>
      </button>
      <button class="tool" id="locate" aria-label="my position">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#544737" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
      </button>
    </div>
  </div>

  <div id="strip"></div>

  <nav id="tabs"></nav>
</div>

<div id="scrim"></div>
<section class="sheet" id="placeSheet"></section>
<section class="sheet" id="stampSheet"></section>
<section class="sheet" id="setSheet"></section>
<div id="toast"></div>

<div id="search">
  <div id="searchTop">
    <button id="searchBack" aria-label="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#544737" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <input id="searchIn" type="search" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="searchClear" aria-label="clear">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6250" stroke-width="1.7"
           stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="searchOut"></div>
</div>

<div id="boot">
  <svg id="bootArt" class="riseA" width="220" height="160" viewBox="0 0 220 160" fill="none">
    <g stroke="#8C5216" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M74 118 C 84 88, 92 70, 99 50"/>
      <path d="M146 118 C 136 88, 128 70, 121 50"/>
      <path d="M79 96 Q 110 84 141 96"/>
      <path d="M84 90 H136"/>
      <path d="M95 62 H125"/>
      <path d="M99 50 L104 24 M121 50 L116 24"/>
      <path d="M103 24 H117"/>
      <path d="M104 24 L110 8 L116 24"/>
      <path d="M110 8 V2"/>
    </g>
    <g stroke="#9DAEAC" stroke-width="4.5" stroke-linecap="round" opacity=".75">
      <path d="M6 132 C 46 120, 76 142, 112 134 C 150 126, 178 144, 214 132"/>
    </g>
    <g stroke="#9DAEAC" stroke-width="1.2" stroke-linecap="round" opacity=".45">
      <path d="M8 143 C 48 131, 78 153, 114 145 C 152 137, 180 155, 216 143"/>
    </g>
    <g fill="#C4832E" opacity=".85">
      <circle cx="36" cy="120" r="3"/><circle cx="63" cy="127" r="3"/>
      <circle cx="160" cy="130" r="3"/><circle cx="192" cy="123" r="3"/>
    </g>
  </svg>
  <div class="ser riseB">MIETTE</div>
  <div class="inparis riseB">in Paris</div>
  <p id="bootMsg" class="riseC"></p>
</div>

<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
